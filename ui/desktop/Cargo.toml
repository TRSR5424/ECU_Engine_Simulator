[package]
name = "desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36.1"
log = "0.4.0"
env_logger = "0.10.0"
reqwest = { version = "0.11", features = ["json", "blocking"] }
tokio = { version = "1.24.2", features = ["full"] }
futures = "0.3.25"
serde = { version = "1.0.152", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"